    <link rel="apple-touch-icon" href="./brand/apple-touch-icon.png" />
    <link href="./fonts/fonts.css" rel="stylesheet" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Store",
        "name": "Венеция",
        "description": "Сеть магазинов обуви, одежды и аксессуаров в Воткинске.",
        "telephone": "+7 995 602-18-99",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Воткинск",
          "streetAddress": "ул. Свердлова, 58",
          "addressCountry": "RU"
        },
        "openingHoursSpecification": [
          { "@type": "OpeningHoursSpecification", "dayOfWeek": ["Monday","Tuesday","Wednesday","Thursday","Friday"], "opens": "09:00", "closes": "20:00" },
          { "@type": "OpeningHoursSpecification", "dayOfWeek": ["Saturday","Sunday"], "opens": "09:00", "closes": "17:00" }
        ],
        "sameAs": ["https://vk.ru/veniceshop"]
      }
    </script>
    <script type="module" crossorigin src="./assets/index-D-N4qcOV.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-CGpK0H1-.css">
  </head>
  <body>
    <section id="boot-fallback" role="status" aria-live="polite" style="max-width: 34rem; margin: 15vh auto; padding: 2rem; font: 18px/1.6 system-ui, sans-serif; color: #29241f;">
      <h1 id="boot-title" style="font-size: 1.8rem; line-height: 1.25;">Открываем «Венецию»…</h1>
      <p id="boot-message">Подождите немного. Загружаем фотографии и каталог.</p>
      <p>Если каталог не открылся, <a href="https://vk.me/veniceshop">напишите в бутик</a> или <a href="tel:+79956021899">позвоните</a>.</p>
      <button id="boot-retry" type="button" hidden style="min-height: 48px; padding: .75rem 1.5rem; border: 0; border-radius: 4px; background: #29241f; color: #fff; font: inherit; cursor: pointer;">Открыть ещё раз</button>
      <noscript><p>Включите JavaScript в браузере, чтобы открыть каталог.</p></noscript>
    </section>
    <div id="root"></div>
    <script>
      (() => {
        let ready = false
        const panel = document.getElementById('boot-fallback')
        const retry = document.getElementById('boot-retry')
        const failed = () => {
          if (ready) return
          document.getElementById('boot-title').textContent = 'Не удалось открыть сайт'
          document.getElementById('boot-message').textContent = 'Возможно, прервалось соединение или сайт обновился. Сохранённые товары и снимки останутся на месте.'
          retry.hidden = false
        }
        retry.addEventListener('click', () => {
          const next = new URL(location.href)
          next.searchParams.set('__venecia_reload', String(Date.now()))
          location.replace(next.href)
        })
        const timeout = setTimeout(failed, 15000)
        window.addEventListener('error', failed, true)
        window.addEventListener('unhandledrejection', failed)
        window.addEventListener('venecia:app-ready', () => {
          ready = true
          clearTimeout(timeout)
          panel.hidden = true
        }, { once: true })
      })()
    </script>
  </body>
</html>
